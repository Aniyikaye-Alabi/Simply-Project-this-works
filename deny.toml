# cargo-deny policy: AGENTS.md section 7.2 (supply chain).

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
# Our own crates are UNLICENSED until the pricing/licensing question (PRD section 11) is settled.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own workspace crates are path dependencies without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
